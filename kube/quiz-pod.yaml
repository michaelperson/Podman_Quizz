# Solution du lab 04, partie 3 (séquence 2.7) : manifeste du pod « quiz ».
#
# Sortie réelle de « podman kube generate quiz » (Podman 6.2.0, rootless),
# obtenue avec les commandes ci-dessous. Seule retouche : un montage hostPath
# de /proc, artefact de l'environnement de test (Podman dans un conteneur), a
# été retiré. Pour la régénérer :
#
#   podman pod create --name quiz -p 8000:8000
#   podman run -d --pod quiz --name quiz-db -e POSTGRES_DB=quiz -e POSTGRES_USER=quiz \
#     -e POSTGRES_PASSWORD=change-moi -v quiz-pgdata:/var/lib/postgresql \
#     docker.io/library/postgres:18.7-trixie
#   podman run -d --pod quiz --name quiz-api -e DB_HOST=127.0.0.1 \
#     -e DB_PASSWORD=change-moi localhost/quiz-api:1.0
#   podman kube generate quiz -f kube/quiz-pod.yaml
#
# Points à faire remarquer aux apprenants :
#  - le mot de passe apparaît EN CLAIR dans les variables (voir quiz-pod-durci.yaml) ;
#  - le port publié sur le pod devient un hostPort... sur le premier conteneur
#    (ici quiz-db), même si c'est l'API qui écoute sur 8000 : dans un pod, le
#    réseau est commun, cela ne change rien ;
#  - l'image de l'API construite avec --format docker garde son HEALTHCHECK,
#    traduit en livenessProbe ;
#  - le volume nommé devient un persistentVolumeClaim du même nom : kube play
#    réutilise le volume Podman existant (les données sont conservées) ;
#
# Rejouer :   podman kube play kube/quiz-pod.yaml
# Arrêter :   podman kube down kube/quiz-pod.yaml
# Save the output of this file and use kubectl create -f to import
# it into Kubernetes.
#
# Created with podman-6.2.0
apiVersion: v1
kind: Pod
metadata:
  annotations:
    io.kubernetes.cri-o.SandboxID/quiz-api: fb26d8a3f671b612e70cd7c8cee24c162877f07d6948fe3aa02146e1dc2a22b8
    io.kubernetes.cri-o.SandboxID/quiz-db: fb26d8a3f671b612e70cd7c8cee24c162877f07d6948fe3aa02146e1dc2a22b8
  creationTimestamp: "2026-11-20T00:10:35Z"
  labels:
    app: quiz
  name: quiz
spec:
  containers:
  - args:
    - postgres
    env:
    - name: POSTGRES_DB
      value: quiz
    - name: POSTGRES_PASSWORD
      value: change-moi
    - name: POSTGRES_USER
      value: quiz
    image: docker.io/library/postgres:18.7-trixie
    name: quiz-db
    ports:
    - containerPort: 8000
      hostPort: 8000
    volumeMounts:
    - mountPath: /var/lib/postgresql
      name: quiz-pgdata-pvc
  - env:
    - name: DB_HOST
      value: 127.0.0.1
    - name: DB_PASSWORD
      value: change-moi
    image: localhost/quiz-api:1.0
    livenessProbe:
      exec:
        command:
        - python
        - healthcheck.py
      failureThreshold: 3
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 3
    name: quiz-api
    securityContext: {}
  volumes:
  - name: quiz-pgdata-pvc
    persistentVolumeClaim:
      claimName: quiz-pgdata
